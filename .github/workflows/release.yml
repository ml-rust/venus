# Manual distribution workflow. Push a v* tag first. `Release Prepare` checks the
# tag and runs the full suite. Then run this workflow with that tag.
#
# Stages:
#   publish_crate   -> crates.io: venus-macros and venus-core, venus-sync,
#                      venus-server, venus
#   github_release  -> GitHub Release, with the changelog section as the body
#                      and CLI archives for five targets attached
#
# Each stage is idempotent and selectable alone. The publish stage skips a version
# already on crates.io. The release stage overwrites the release in place. After an
# error, re-dispatch with only the stage that errored on.
#
# Required secret: CARGO_REGISTRY_TOKEN, readable from environment `crates-io`.

name: Release
run-name: Release ${{ inputs.tag }}

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish, e.g. v0.1.4"
        required: true
        type: string
      publish_crate:
        description: "Publish the venus workspace crates to crates.io"
        type: boolean
        default: true
      github_release:
        description: "Create the GitHub Release"
        type: boolean
        default: true

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Always runs, so the dispatched tag gets the same check as the prepare run.
  validate-version:
    uses: ./.github/workflows/release-validate.yml
    with:
      ref: ${{ inputs.tag }}

  # ── crates.io ───────────────────────────────────────────────────────────────
  publish-crate:
    name: Publish to crates.io
    needs: validate-version
    if: inputs.publish_crate
    runs-on: ubuntu-latest
    environment: crates-io
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable

      - name: Set version from tag
        run: bash scripts/ci/stamp_version.sh "${{ needs.validate-version.outputs.version }}"

      # Publishes in dependency tiers. Each tier waits until the index serves all
      # its crates. A crate already on crates.io is skipped, so a re-run resumes.
      - name: Publish workspace crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          VERSION=$(cargo metadata --no-deps --format-version=1 \
            | jq -r '.packages[] | select(.name == "venus") | .version')

          is_published() {
            curl -sf \
              -H "User-Agent: venus-ci (github.com/ml-rust/venus)" \
              "https://crates.io/api/v1/crates/$1/$2" > /dev/null 2>&1
          }

          # `cargo publish` resolves dependencies against the sparse index. The
          # API can list a version before the index serves it.
          in_index() {
            local crate="$1"
            curl -sf "https://index.crates.io/${crate:0:2}/${crate:2:2}/${crate}" \
              | jq -e --arg v "$VERSION" 'select(.vers == $v)' > /dev/null
          }

          wait_for() {
            local crate="$1"
            echo "  Waiting for $crate@$VERSION in the index..."
            for _ in $(seq 1 60); do
              if in_index "$crate"; then
                echo "  $crate@$VERSION is in the index"
                return 0
              fi
              sleep 5
            done
            echo "::error::$crate@$VERSION did not reach the crates.io index. Re-run this stage."
            return 1
          }

          publish_tier() {
            local tier_name="$1"
            shift
            local crate

            echo "::group::Tier: $tier_name"
            for crate in "$@"; do
              if is_published "$crate" "$VERSION"; then
                echo "  $crate@$VERSION already published, skipping"
              else
                echo "  Publishing $crate@$VERSION..."
                cargo publish -p "$crate" --allow-dirty
              fi
            done

            for crate in "$@"; do
              wait_for "$crate"
            done
            echo "::endgroup::"
          }

          publish_tier "1 (no internal deps)" venus-macros venus-core
          publish_tier "2 (depends on tier 1)" venus-sync
          publish_tier "3 (depends on tier 2)" venus-server
          publish_tier "4 (CLI binary)" venus

  # ── CLI binaries ────────────────────────────────────────────────────────────
  # Runs with the GitHub Release stage, which attaches these archives.
  build-cli:
    name: Build CLI (${{ matrix.label }})
    needs: validate-version
    if: inputs.github_release
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runs-on: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            label: linux-x64
          - runs-on: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            label: linux-arm64
          - runs-on: macos-latest
            target: aarch64-apple-darwin
            label: macos-arm64
          - runs-on: macos-15-intel
            target: x86_64-apple-darwin
            label: macos-x64
          - runs-on: windows-latest
            target: x86_64-pc-windows-msvc
            label: windows-x64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: release-${{ matrix.target }}

      - name: Set version from tag
        shell: bash
        run: bash scripts/ci/stamp_version.sh "${{ needs.validate-version.outputs.version }}"

      - name: Build release binary
        run: cargo build -p venus --release --target ${{ matrix.target }}

      - name: Package (unix)
        if: runner.os != 'Windows'
        run: |
          cd "target/${{ matrix.target }}/release" || exit 1
          chmod +x venus
          tar czf venus-${{ needs.validate-version.outputs.version }}-${{ matrix.label }}.tar.gz venus
          ls -lh venus-*.tar.gz

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cd target/${{ matrix.target }}/release
          Compress-Archive -Path venus.exe -DestinationPath venus-${{ needs.validate-version.outputs.version }}-${{ matrix.label }}.zip

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cli-${{ matrix.label }}
          path: |
            target/${{ matrix.target }}/release/venus-*.tar.gz
            target/${{ matrix.target }}/release/venus-*.zip
          retention-days: 1

  # ── GitHub Release ──────────────────────────────────────────────────────────
  # Independent of publish-crate: a crates.io outage does not block the release.
  github-release:
    name: Create GitHub Release
    needs: [validate-version, build-cli]
    if: inputs.github_release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      - name: Download binary artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ./artifacts
          pattern: "cli-*"
          merge-multiple: true

      # The changelog is the release notes. `validate-version` already checks that
      # this section exists and is non-empty.
      - name: Build release notes from the changelog
        env:
          TAG: ${{ inputs.tag }}
          BASE: ${{ needs.validate-version.outputs.base_version }}
        run: |
          set -euo pipefail
          # `-l` is required: `git tag` with a pattern and no list flag is the
          # create form, which errors and drops the compare link.
          PREVIOUS_TAG=$(git tag -l --sort=-v:refname 'v*' | grep -v "^${TAG}$" | head -n 1 || true)

          bash scripts/ci/changelog_section.sh "$BASE" /tmp/changelog-section.md

          {
            cat /tmp/changelog-section.md
            echo
            if [[ -n "$PREVIOUS_TAG" ]]; then
              echo "**Full diff:** https://github.com/ml-rust/venus/compare/${PREVIOUS_TAG}...${TAG}"
            else
              echo "**Tree:** https://github.com/ml-rust/venus/tree/${TAG}"
            fi
          } > /tmp/release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ inputs.tag }}
          name: Venus ${{ needs.validate-version.outputs.version }}
          body_path: /tmp/release-notes.md
          draft: false
          prerelease: ${{ needs.validate-version.outputs.is_full_release != 'true' }}
          files: artifacts/*
          fail_on_unmatched_files: true
